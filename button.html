<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>催更笺</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f3efeb;  /* 仿古宣纸底色 */
            background-image: radial-gradient(circle at 20% 30%, rgba(200, 180, 150, 0.3) 0%, transparent 30%),
                              linear-gradient(165deg, #e8d9c5 0%, #e4d8cb 100%);
            font-family: '华文楷体', 'KaiTi', '楷体', 'STKaiti', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #4a3b2c;
            position: relative;
        }
        /* 纸张纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" stitchTiles="stitch"/></filter><rect width="100" height="100" filter="url(%23noise)" opacity="0.03"/></svg>');
            pointer-events: none;
            opacity: 0.2;
            z-index: 1;
        }
        /* 水墨印章装饰 */
        .seal-left {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border: 2px solid #b36b4b;
            border-radius: 2px 15px 2px 15px;
            transform: rotate(-10deg);
            opacity: 0.3;
            z-index: 2;
        }
        .seal-left::after {
            content: '鱼';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #b36b4b;
            font-family: '华文隶书', 'LiSu', cursive;
        }
        .seal-right {
            position: fixed;
            right: 30px;
            top: 30px;
            width: 45px;
            height: 45px;
            border: 2px solid #9c7c5c;
            border-radius: 50% 20% 50% 20%;
            transform: rotate(15deg);
            opacity: 0.25;
            z-index: 2;
        }
        .seal-right::after {
            content: '梦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #9c7c5c;
        }
        
        .古笺 {
            max-width: 550px;
            width: 100%;
            background: #f9efe2;  /* 牙色底 */
            border: 1px solid #b7a287;
            border-radius: 2px;
            padding: 35px 28px;
            box-shadow: 0 15px 30px rgba(90, 60, 30, 0.2), 
                        0 0 0 1px #e5d5c0 inset,
                        0 0 0 2px #f5ede1 inset;
            position: relative;
            z-index: 10;
            transition: 0.2s;
        }
        /* 仿古籍书口 */
        .古笺::after {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 8px;
            width: 2px;
            background: linear-gradient(to bottom, #b7a287 0%, #dac9b2 50%, #b7a287 100%);
            opacity: 0.4;
        }
        
        .笺头 {
            text-align: center;
            border-bottom: 2px solid #d4b28c;
            padding-bottom: 20px;
            margin-bottom: 25px;
            position: relative;
        }
        .笺头 h1 {
            font-size: 3em;
            font-weight: normal;
            letter-spacing: 6px;
            color: #6b4f3a;
            text-shadow: 1px 1px 0 #e5d5c0;
            margin-bottom: 8px;
            font-family: '华文楷体', 'KaiTi', serif;
        }
        .笺头 h2 {
            font-size: 1.1em;
            font-weight: normal;
            color: #9b7e64;
            font-style: italic;
            letter-spacing: 2px;
        }
        .笺头小印 {
            position: absolute;
            right: 10px;
            bottom: 5px;
            font-size: 0.8em;
            color: #b36b4b;
            border: 1px solid #d4a88c;
            padding: 2px 8px;
            border-radius: 20px;
            transform: rotate(-2deg);
            opacity: 0.8;
        }
        
        .计数联 {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 30px 0;
        }
        .计数框 {
            flex: 1;
            background: #f4e8d8;
            border: 1px solid #cfb99c;
            border-radius: 4px;
            padding: 20px 10px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(140, 100, 70, 0.1);
        }
        .计数框 .label {
            font-size: 1em;
            color: #9b7e64;
            margin-bottom: 12px;
            letter-spacing: 2px;
            border-bottom: 1px dashed #cfb99c;
            padding-bottom: 8px;
        }
        .计数框 .number {
            font-size: 3.5em;
            font-family: '华文楷体', 'KaiTi', serif;
            line-height: 1.2;
        }
        .total-num {
            color: #8b5a3c;
        }
        .today-num {
            color: #6d8a7d;
        }
        
        .踢案 {
            text-align: center;
            margin: 35px 0 20px;
            position: relative;
        }
        .踢鱼之钮 {
            background: #e7d7c2;
            border: 2px solid #aa8b70;
            color: #5e3f2e;
            padding: 18px 45px;
            font-size: 2.2em;
            font-family: '华文楷体', 'KaiTi', serif;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #9b826a, 0 8px 15px rgba(100, 70, 40, 0.2);
            transition: 0.1s;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            letter-spacing: 6px;
            font-weight: normal;
            transform: rotate(-0.2deg);
        }
        .踢鱼之钮:hover {
            background: #efe1cf;
            transform: translateY(-2px) rotate(-0.2deg);
            box-shadow: 0 6px 0 #9b826a, 0 12px 20px rgba(100, 70, 40, 0.25);
        }
        .踢鱼之钮:active {
            transform: translateY(3px) rotate(-0.2deg);
            box-shadow: 0 2px 0 #9b826a, 0 5px 10px rgba(100, 70, 40, 0.2);
        }
        
        .砚台 {
            border-radius: 2px;
            padding: 20px 18px;
            margin: 30px 0 20px;
            min-height: 80px;
            font-size: 1.2em;
            color: #6b4f3a;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }
        
        .落款 {
            text-align: right;
            font-size: 0.9em;
            color: #a6896e;
            margin-top: 25px;
            border-top: 1px solid #dccbb4;
            padding-top: 18px;
            font-style: italic;
        }
        .落款 span {
            padding: 3px 10px;
            color: #a79e93;
            border-radius: 20px 2px 20px 2px;
        }
        .匿名印 {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 12px;
            background: #a79e93;
            color: #f5f1ec;
            border-radius: 30px;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <!-- 水墨印章装饰 -->
    <div class="seal-left"></div>
    <div class="seal-right"></div>
    
    <div class="古笺">
        <div class="笺头">
            <h1>催更笺</h1>
            <h2>—— WJNing 手录 ——</h2>
            <div class="笺头小印">江晏过来挨踢</div>
        </div>
        
        <!-- 计数联（左右并排） -->
        <div class="计数联">
            <div class="计数框">
                <div class="label">全海域累计</div>
                <div class="number total-num" id="totalCount">--</div>
            </div>
            <div class="计数框">
                <div class="label">今日鱼跃</div>
                <div class="number today-num" id="todayCount">--</div>
            </div>
        </div>
        
        <!-- 踢案（催更按钮） -->
        <div class="踢案">
            <button class="踢鱼之钮" id="anonymBtn" onclick="handleAnonymousKick()">
                催更
            </button>
        </div>
        
        <!-- 砚台（随机文案区） -->
        <div class="砚台" id="randomMessage">
            看不到催更铲不动咯T^T
        </div>
        
        <div class="落款">
            <span>匿名 · 无痕 · 随意踢</span>
            <div class="匿名印">无人知是君来</div>
        </div>
    </div>

    <script>
        (function() {
            // ========== 配置 ==========
            const API_NAMESPACE = 'yuyu_anonymous';    // 你的匿名命名空间
            const API_COUNTER = 'total_cuigeng';
            const API_TODAY = 'today_cuigeng';
            // =========================
            
            const 总数显示 = document.getElementById('totalCount');
            const 今日显示 = document.getElementById('todayCount');
            const 消息框 = document.getElementById('randomMessage');
            
            // 古风文案库（全是文言/古白话风）
            const 文案库 = [
                '江晏脊背一震，又挨一尾',
                '江晏：今夜想用什么姿势？',
                '冷面水母打了个喷嚏',
                '那片面包啪叽一下，甩江晏脸上',
                '牵了手，就要负责哦',
                '江晏：（侧目）又是何人？',
                '江晏：（无奈）调皮！',
            ];
            
            // 初始化计数
            async function 初始化() {
                await 获取全站计数();
            }
            
            async function 获取全站计数() {
                try {
                    const totalRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_COUNTER}`);
                    const totalData = await totalRes.json();
                    总数显示.innerText = totalData.count;
                    
                    const todayRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_TODAY}`);
                    const todayData = await todayRes.json();
                    今日显示.innerText = todayData.count;
                } catch (e) {
                    console.warn('获取计数失败，用旧梦暂代', e);
                    总数显示.innerText = '6666';
                    今日显示.innerText = '66';
                }
            }
            
            // 处理匿名踢
            window.handleAnonymousKick = async function() {
                try {
                    // 增加总数
                    const totalRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_COUNTER}/up`);
                    const totalData = await totalRes.json();
                    总数显示.innerText = totalData.count;
                    
                    // 增加今日
                    const todayRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_TODAY}/up`);
                    const todayData = await todayRes.json();
                    今日显示.innerText = todayData.count;
                    
                    // 随机古风文案
                    const 随机索引 = Math.floor(Math.random() * 文案库.length);
                    消息框.innerText = `✎ ${文案库[随机索引]}`;
                    
                    // 1.5秒后恢复（可选）
                    setTimeout(() => {
                        消息框.innerText = '✎ 感谢少东家的支持！';
                    }, 4000);
                    
                } catch (error) {
                    console.error('催更失败', error);
                    消息框.innerText = '✎ 墨尽，但江晏已知';
                }
            };
            
            // 启动
            初始化();
        })();
    </script>
</body>
</html>
