// 等待页面完全加载后再执行
window.onload = function() {
    console.log('页面加载完成，初始化选项卡');
    
    // 获取元素
    const btnAuthor = document.getElementById('btn-author');
    const btnArticle = document.getElementById('btn-article');

    // 检查元素是否存在
    console.log('作者按钮:', btnAuthor);
    console.log('文章按钮:', btnArticle);
    console.log('作者标签:', tabAuthor);
    console.log('文章标签:', tabArticle);
    
    // 定义切换函数（挂在 window 上，让 onclick 能调用）
    window.switchTab = function(tabName) {
        console.log('切换选项卡:', tabName);
        
        if (tabName === 'author') {
            // 显示作者卡片
            tabAuthor.classList.add('active');
            tabArticle.classList.remove('active');
            
            // 按钮激活状态
            btnAuthor.classList.add('active');
            btnArticle.classList.remove('active');
        } else {
            // 显示文章
            tabArticle.classList.add('active');
            tabAuthor.classList.remove('active');
            
            // 按钮激活状态
            btnArticle.classList.add('active');
            btnAuthor.classList.remove('active');
        }
    };
};

<script>
// ===== 回到顶部功能 =====
function scrollToTop() {
    window.scrollTo({
        top: 200,
        behavior: 'smooth'  // 平滑滚动
    });
}

// ===== 切换主题功能 =====
function toggleTheme() {
    // 获取当前主题
    const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
    // 切换到相反的主题
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    
    // 更新 body 的 class
    document.body.className = newTheme;
    
    // 保存到 localStorage
    localStorage.setItem('theme', newTheme);
    
    // 更新按钮图标
    const themeBtn = document.querySelector('.top-btn:first-child');
    if (themeBtn) {
        themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
    }
    
    // 同步 Artalk 主题（如果你有 artalkInstance）
    if (window.artalkInstance) {
        window.artalkInstance.setDarkMode(newTheme === 'dark');
    }
    
    console.log('主题已切换为：', newTheme);
}

// ===== 页面加载时初始化主题 =====
document.addEventListener('DOMContentLoaded', function() {
    // 读取保存的主题，默认为浅色
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.body.className = savedTheme;
    
    // 初始化按钮图标
    const themeBtn = document.querySelector('.top-btn:first-child');
    if (themeBtn) {
        themeBtn.textContent = savedTheme === 'light' ? '🌙' : '☀️';
    }
});

    (function() {
    // ========== 配置 ==========
    const API_NAMESPACE = 'yuyu_anonymous';
    const API_COUNTER = 'total_cuigeng';
    const API_TODAY = 'today_cuigeng';
    // =========================
    
    const 总数显示 = document.getElementById('totalCount');
    const 今日显示 = document.getElementById('todayCount');
    const 消息框 = document.getElementById('randomMessage');
    
    // 古风文案库
    const 文案库 = [
        '江晏脊背一震，又挨一尾',
        '江晏：今夜想用什么姿势？',
        '冷面水母打了个喷嚏',
        '那片面包啪叽一下，甩江晏脸上',
        '江晏：（侧目）又是何人？',
        '江晏：（无奈）调皮！',
        '牵了手，就要负责喔。',
        '江晏：想吃鹌鹑腿还是面包？还是……我？',
        '江晏：可还记得回家的路？',
        '江晏：（无奈）小宝，别闹了。',
    ];
    
    // 初始化计数
    async function 初始化() {
        await 获取全站计数();
    }
    
    async function 获取全站计数() {
        try {
            const totalRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_COUNTER}`);
            const totalData = await totalRes.json();
            总数显示.innerText = totalData.count;
            
            const todayRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_TODAY}`);
            const todayData = await todayRes.json();
            今日显示.innerText = todayData.count;
        } catch (e) {
            console.warn('获取计数失败，用默认值', e);
            总数显示.innerText = '--';
            今日显示.innerText = ' ';
        }
    }
    
    // 处理匿名踢（无冷却）
    window.handleAnonymousKick = async function() {
        try {
            // 增加总数
            const totalRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_COUNTER}/up`);
            const totalData = await totalRes.json();
            总数显示.innerText = totalData.count;
            
            // 增加今日
            const todayRes = await fetch(`https://api.counterapi.dev/v1/${API_NAMESPACE}/${API_TODAY}/up`);
            const todayData = await todayRes.json();
            今日显示.innerText = todayData.count;
            
            // 随机文案
            const 随机索引 = Math.floor(Math.random() * 文案库.length);
            消息框.innerText = `${文案库[随机索引]}`;
            
            // 4秒后恢复默认
            setTimeout(() => {
                消息框.innerText = '感谢少东家的支持！';
            }, 4000);
            
        } catch (error) {
            console.error('催更失败', error);
            消息框.innerText = '墨尽，但江晏已知';
        }
    };

    // ========== Artalk 初始化 ==========
        setTimeout(() => {
            artalkInstance = Artalk.init({
                el: '#artalk-test',
                server: 'https://artalkjs-production.up.railway.app',
                site: '鱼鱼书阁测试',
                pageKey: 'test-page',
                pageTitle: '测试页面',
                placeholder: '说点什么测试一下...',
                login: true,  // 显示登录按钮！关键参数
                darkMode: document.body.classList.contains('dark'),
            });
            console.log('Artalk 初始化完成，登录按钮已启用');
            
            // #标签高亮功能
            setInterval(() => {
                document.querySelectorAll('.artalk-content').forEach(el => {
                    if (el.dataset.hashtagProcessed) return;
                    
                    const regex = /#([\w\u4e00-\u9fa5]+)/g;
                    el.innerHTML = el.innerHTML.replace(regex, '<span class="hashtag" style="color: var(--button-bg); font-weight:500;">#$1</span>');
                    el.dataset.hashtagProcessed = 'true';
                });
            }, 500);
        }, 200);
    
    // 启动
    初始化();
})();
</script>
