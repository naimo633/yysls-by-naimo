<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>灵鲛织梦-阅读器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artalk@2/dist/Artalk.css">
    <link rel="stylesheet" href="../../../setting/style.css">
    <link rel="stylesheet" href="../../../setting/reader.css"> 
</head>

<body class="light">
    <!-- 右上角工具栏 -->
    <div class="top-bar">
        <button class="top-btn" onclick="toggleTheme()"><img src="../../../setting/image/light.png"></button>
        <button class="top-btn" onclick="scrollToTop()"><img src="../../../setting/image/top.png"></button>
        <button class="top-btn" onclick="window.location.href='../../../index.html'"><img src="../../../setting/image/home.png" alt="首页"></button>
    </div>

    <!-- 弹窗目录 -->
    <div class="catalog-modal" id="catalogModal" onclick="if(event.target === this) hideCatalog()">
        <div class="catalog-panel">
            <h3>目录</h3>
            <ul class="catalog-list" id="catalogList">
                <!-- JS动态生成 -->
            </ul>
            <button class="close-modal" onclick="hideCatalog()">关 闭</button>
        </div>
    </div>

    <!-- 外层容器：负责宽度限制和内部排列 -->
    <div class="outer-container">
        <div class="pure-reader" id="articleContainer">
            <div class="loading">加载文章中...</div>
        </div>
        <!-- Artalk 评论区容器 -->
        <div id="artalk-comments" class="comment-section"></div>
        <script src="https://cdn.jsdelivr.net/npm/artalk@2/dist/Artalk.js"></script> 
    </div>
    <script>
    // ===== 章节目录配置（写死在HTML里） =====
    const chapters = [
        { id: 'ljzm-1', title: '第一章 送子观音陈子奚', file: 'articles/ljzm-1.txt' },
        { id: 'ljzm-2', title: '第二章 你要找什么东西', file: 'articles/ljzm-2.txt' },
        { id: 'ljzm-3', title: '第三章 后续章节名', file: 'articles/ljzm-3.txt' }
    ];
    
    let currentChapterIndex = 0; // 当前章节索引
    
    // ===== 从URL获取章节ID =====
    function getChapterFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('chapter') || 'ljzm-1';
    }
    
    // ===== 加载文章 =====
    async function loadChapter(chapterId) {
        const container = document.getElementById('articleContainer');
        container.innerHTML = '<div class="loading">加载文章中...</div>';
        
        const chapterIndex = chapters.findIndex(ch => ch.id === chapterId);
        if (chapterIndex === -1) {
            container.innerHTML = '<div class="loading">文章不存在</div>';
            return;
        }
        
        currentChapterIndex = chapterIndex;
        const chapter = chapters[chapterIndex];
        
        try {
            const response = await fetch(chapter.file);
            const text = await response.text();
            
            const parts = text.split('---');
            const title = parts[0]?.trim() || chapter.title;
            const authorDesc = parts[1]?.trim() || '';
            const tagsStr = parts[2]?.trim() || '';
            const contentText = parts[3]?.trim() || text;
            
            const tagHtml = tagsStr.split(',').map(tag => {
                const [text, className] = tag.split(':');
                return `<span class="${className || 'tag1'}">${text}</span>`;
            }).join('');
            
            const paragraphs = contentText.split('\n').filter(p => p.trim() !== '');
            const contentHtml = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
            
            document.title = `灵鲛织梦-${title}`;
            
            container.innerHTML = `
                <h1 class="article-title">${title}</h1>
                <div class="article-author">${authorDesc}</div>
                <div class="article-tags">${tagHtml}</div>
                <div class="article-content">${contentHtml}</div>
                <div class="chapter-nav">
                    <p class="prev-chapter">
                        ${currentChapterIndex > 0 ? 
                            `<a href="?chapter=${chapters[currentChapterIndex-1].id}" class="prev-link">← ${chapters[currentChapterIndex-1].title}</a>` 
                            : ''}
                    </p>
                    <a href="javascript:void(0)" onclick="showCatalog()" class="catalog-link">目录</a>
                    <p class="next-chapter">
                        ${currentChapterIndex < chapters.length - 1 ? 
                            `<a href="?chapter=${chapters[currentChapterIndex+1].id}" class="next-link">${chapters[currentChapterIndex+1].title} →</a>` 
                            : ''}
                    </p>
                </div>
            `;
            
            const url = new URL(window.location);
            url.searchParams.set('chapter', chapterId);
            window.history.pushState({}, '', url);
            
        } catch (error) {
            console.error('加载失败:', error);
            container.innerHTML = `
                <div class="loading" style="color: #e06e6e;">
                    加载失败：${error.message}<br>
                    <button onclick="loadChapter('${chapterId}')" style="margin-top:20px; padding:8px 20px;">重试</button>
                </div>
            `;
        }
    }
    
    // ===== 显示目录弹窗 =====
    function showCatalog() {
        const modal = document.getElementById('catalogModal');
        const list = document.getElementById('catalogList');
        
        list.innerHTML = chapters.map((ch, index) => `
            <li>
                <a href="?chapter=${ch.id}" 
                   class="${index === currentChapterIndex ? 'current' : ''}"
                   onclick="hideCatalog(); loadChapter('${ch.id}'); return false;">
                    ${ch.title}
                </a>
            </li>
        `).join('');
        
        modal.classList.add('show');
    }
    
    function hideCatalog() {
        document.getElementById('catalogModal').classList.remove('show');
    }
    
    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function toggleTheme() {
        const currentTheme = document.body.classList.contains('dark') ? 'dark' : 'light';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        
        document.body.className = newTheme;
        localStorage.setItem('theme', newTheme);
        
        const themeBtn = document.querySelector('.top-btn:first-child');
        if (themeBtn) {
            themeBtn.innerHTML = newTheme === 'light' ? 
                '<img src="../../../setting/image/light.png">' : 
                '<img src="../../../setting/image/dark.png">';
        }
    }
    
    // ===== 初始化所有功能 =====
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化主题
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.className = savedTheme;
        
        const themeBtn = document.querySelector('.top-btn:first-child');
        if (themeBtn) {
            themeBtn.innerHTML = savedTheme === 'light' ? 
                '<img src="../../../setting/image/light.png">' : 
                '<img src="../../../setting/image/dark.png">';
        }
        
        // 加载文章
        const chapterId = getChapterFromUrl();
        loadChapter(chapterId);
        
        // 初始化评论区（延迟一下确保容器存在）
        setTimeout(function() {
            if (window.artalkInstance) {
                window.artalkInstance.destroy();
            }
            
            window.artalkInstance = Artalk.init({
                el: '#artalk-comments',
                server: 'https://artalkjs-production.up.railway.app',
                site: 'yanzhu-ljzm',
                pageKey: 'ljzm',
                pageTitle: '灵鲛织梦',
                placeholder: '冒个泡泡...',
                login: true,
                darkMode: document.body.classList.contains('dark'),
            });
        }, 500);
    });

    // 监听浏览器后退/前进
    window.addEventListener('popstate', function() {
        const chapterId = getChapterFromUrl();
        loadChapter(chapterId);
    });
</script>
</body>
</html>
